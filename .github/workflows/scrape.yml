name: T480 — voitures d'occasion (Maroc)

on:
  workflow_dispatch:
    inputs:
      detail_workers:
        description: "Parallel detail-page requests (lower = gentler on avito.ma)"
        default: "3"
      detail_delay:
        description: "Seconds to wait before each detail request"
        default: "0.5"
      max_details:
        description: "Fetch at most N uncached detail pages (0 = all remaining)"
        default: "0"
      refresh_top:
        description: "Re-fetch the first N search pages to pick up new ads (0 = skip)"
        default: "0"
      refresh_sources:
        description: "Re-fetch the head of the other marketplaces' feeds too (0 = skip)"
        default: "5"
  schedule:
    # The feed is sorted newest-first, so refreshing the head of the
    # pagination collects the day's new listings without re-walking the
    # whole 891-page crawl.
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: avito-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crawl cache
        run: |
          for pack in data/cache/*.tar.gz; do
            [ -e "$pack" ] || continue
            echo "unpacking $pack"
            tar -xzf "$pack" -C data
          done
          echo "cached pages:   $(ls data/pages 2>/dev/null | wc -l)"
          echo "cached details: $(ls data/details 2>/dev/null | wc -l)"
          echo "cached sources: $(du -sh data/sources 2>/dev/null || echo none)"

      - name: Scrape
        env:
          DETAIL_WORKERS: ${{ inputs.detail_workers || '3' }}
          DETAIL_DELAY: ${{ inputs.detail_delay || '0.5' }}
          MAX_DETAILS: ${{ inputs.max_details || '0' }}
          REFRESH_TOP: ${{ github.event_name == 'schedule' && '40' || inputs.refresh_top || '0' }}
        run: |
          # A scheduled run first re-reads the first pages of the search feed
          # to discover new ads, then fetches the detail pages that are still
          # missing. A manual run defaults to the cache only.
          if [ "$REFRESH_TOP" != "0" ]; then
            python3 scraper.py \
              --refresh-top "$REFRESH_TOP" \
              --detail-workers "$DETAIL_WORKERS" \
              --detail-delay "$DETAIL_DELAY" \
              --max-details "$MAX_DETAILS" \
              --no-excel
          fi
          python3 scraper.py \
            --export-only \
            --detail-workers "$DETAIL_WORKERS" \
            --detail-delay "$DETAIL_DELAY" \
            --max-details "$MAX_DETAILS"

      - name: Re-run to mop up rate-limited pages
        run: |
          # Each pass retries the still-missing detail pages after a 429 storm.
          # --no-excel keeps the intermediate passes cheap; the final pass
          # below rebuilds the workbook from whatever the cache now holds.
          for attempt in 1 2 3; do
            remaining=$(python3 scraper.py --pending-details | grep -oE '^[0-9]+')
            echo "mop-up pass $attempt: $remaining detail pages still missing"
            [ "$remaining" = "0" ] && break
            python3 scraper.py --export-only --no-excel
          done
          python3 scraper.py --export-only --skip-details
          echo "final remaining: $(python3 scraper.py --pending-details)"

      - name: Crawl the other Moroccan marketplaces
        env:
          REFRESH_SOURCES: ${{ inputs.refresh_sources || '5' }}
        run: |
          # Every site in sources/: robots.txt was checked first (or does not
          # exist), pages and detail specs are cached under data/sources/, and
          # only the head of each feed is re-read so new ads still show up.
          python3 - "$REFRESH_SOURCES" <<'PY'
          import logging, sys
          logging.basicConfig(level=logging.INFO,
                              format="%(asctime)s %(levelname)s %(message)s")
          top = int(sys.argv[1] or 0)
          from sources.kifal import crawl as crawl_kifal
          from sources.oneclickdrive import crawl as crawl_oneclickdrive
          from sources.wandaloo import crawl as crawl_wandaloo
          from sources.publimaroc import crawl as crawl_publimaroc
          from sources.otoclic import crawl as crawl_otoclic
          crawl_kifal("data", refresh_top=top)
          crawl_oneclickdrive("data", refresh_top=top)
          crawl_wandaloo("data", refresh_top=top)
          crawl_publimaroc("data", refresh_top=top)
          crawl_otoclic("data", refresh_top=top)
          PY

      - name: Merge every source into the unified workbook
        run: python3 merge.py

      - name: Report essentials coverage
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name in ("avito_cars.json", "T480_maroc.json"):
              path = pathlib.Path("data") / name
              if not path.exists():
                  continue
              records = json.loads(path.read_text())
              total = len(records) or 1
              print(f"== {name}: {total} rows")
              if name == "T480_maroc.json":
                  by_site = {}
                  for row in records:
                      site = row.get("source") or "avito"
                      by_site[site] = by_site.get(site, 0) + 1
                  for site, count in sorted(by_site.items()):
                      print(f"   {site:16} {count}")
              print(f"   collapsed re-posts: {sum(1 for r in records if r.get('merged_ads', 1) > 1)}")
              for field in ("brand", "model", "year", "price"):
                  filled = sum(1 for r in records
                               if (r.get("other_params") or {}).get(field)
                               or r.get(field))
                  print(f"   {field:17} {filled} ({100 * filled / total:.1f} %)")
          PY

      - name: Upload workbook
        uses: actions/upload-artifact@v4
        with:
          name: T480-avito-cars
          path: |
            data/avito_cars.xlsx
            data/avito_cars.csv
          retention-days: 30

      - name: Upload unified workbook
        uses: actions/upload-artifact@v4
        with:
          name: T480-maroc-cars
          path: |
            data/T480_maroc.xlsx
            data/T480_maroc.csv
          retention-days: 30

      - name: Commit cache + exports back
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tar -czf data/cache/pages.tar.gz -C data pages
          tar -czf data/cache/details.tar.gz -C data details
          if [ -d data/sources ]; then
            tar -czf data/cache/sources.tar.gz -C data sources
          fi
          git add -A data/cache
          if git diff --staged --quiet; then
            echo "cache unchanged"
          else
            git commit -m "chore: refresh scrape cache from Actions"
            git push
          fi
